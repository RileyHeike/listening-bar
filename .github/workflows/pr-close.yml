name: Pull request closed

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  teardown:
    if: >-
      vars.AWS_ACCOUNT_ID != ''
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Deleting a CloudFront distribution takes a while.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
      ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      DOMAIN: ${{ vars.BAR_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/bar-ci-preview
          aws-region: us-west-2
      - name: Remove the shared preview site files
        if: env.DOMAIN != ''
        env:
          PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
        run: aws s3 rm "s3://$PREVIEW_BUCKET/pr-$PR/" --recursive
      - name: Destroy pr-${{ env.PR }} stacks
        working-directory: infra
        run: >
          pnpm exec cdk destroy --all -c env=preview -c "pr=$PR" --force
          --role-arn "arn:aws:iam::$ACCOUNT:role/bar-ci-preview-exec"
      # CDK's helper functions (bucket auto-delete, site upload) create their
      # own log groups at run time, so destroying the stacks leaves them.
      # The trailing dash keeps PR 5 from matching PR 50.
      - name: Delete pr-${{ env.PR }} log groups the stacks did not own
        run: |
          aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/pr-$PR-" \
            --query 'logGroups[].logGroupName' --output text | tr '\t' '\n' |
            while read -r group; do
              if [ -n "$group" ] && [ "$group" != None ]; then
                echo "Deleting $group"
                aws logs delete-log-group --log-group-name "$group"
              fi
            done
