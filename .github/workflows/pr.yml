name: Pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Agents' PRs queue instead of cancelling, so a fix job is not cut off by
# the push it makes.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !startsWith(github.head_ref, 'claude/') }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Squash merges use the PR title as the commit message, which drives
  # release-please, so it must follow Conventional Commits.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -sSfL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$(curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt | grep linux_amd64 | cut -d' ' -f1)  actionlint.tgz" | sha256sum -c
          tar -xzf actionlint.tgz actionlint && ./actionlint -color
      - name: zizmor (workflow security)
        run: pipx run zizmor==1.30.1 --min-severity medium .github/workflows

  # Every generator's output must pass typecheck, lint, tests, a site build
  # and a CDK synth. Always reports (required checks cannot be path-filtered),
  # but only does the work when generator inputs changed.
  generators:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(tools/generators/|packages/core/src/(events|manifest)/|fixtures/src/|apps/web/src/(page-defs|pages)/|infra/|packages/server/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No generator inputs changed."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup
      - if: steps.changes.outputs.run == 'true'
        run: SMOKE_IN_PLACE=1 tools/generators/smoke.sh

  # Per-PR preview: its own backend stacks and, until the domain exists, its
  # own CloudFront site (afterwards: pr-<n>.preview.<domain> on the shared
  # preview distribution). Seeded with fixtures, then verified end to end.
  # Skipped for forks and Dependabot, which cannot assume AWS roles.
  preview:
    needs: checks
    if: >-
      vars.AWS_ACCOUNT_ID != ''
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      AWS_REGION: us-west-2
      ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      DOMAIN: ${{ vars.BAR_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/bar-ci-preview
          aws-region: ${{ env.AWS_REGION }}
      - name: Build the preview site
        env:
          BAR_ENV: preview
        run: pnpm --filter @bar/web run build
      # A stack whose first create failed cannot be updated, only deleted.
      - name: Clear a failed earlier attempt
        run: |
          for stack in "pr-$PR-stateless" "pr-$PR-stateful"; do
            status=$(aws cloudformation describe-stacks --stack-name "$stack" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
            case "$status" in
              ROLLBACK_COMPLETE | ROLLBACK_FAILED | DELETE_FAILED)
                echo "Deleting $stack ($status)"
                aws cloudformation delete-stack --stack-name "$stack" \
                  --role-arn "arn:aws:iam::$ACCOUNT:role/bar-ci-preview-exec"
                aws cloudformation wait stack-delete-complete --stack-name "$stack"
                ;;
            esac
          done
      - name: Deploy pr-${{ env.PR }}
        working-directory: infra
        run: |
          site=()
          if [ -z "$DOMAIN" ]; then site=(-c "siteDist=$GITHUB_WORKSPACE/apps/web/dist"); fi
          pnpm exec cdk deploy --all -c env=preview -c "pr=$PR" "${site[@]}" \
            --require-approval never \
            --role-arn "arn:aws:iam::$ACCOUNT:role/bar-ci-preview-exec" \
            --outputs-file outputs.json
      - name: Read endpoints
        run: |
          if [ -n "$DOMAIN" ]; then
            pnpm --filter @bar/infra exec tsx scripts/ci-outputs.ts outputs.json --config ../apps/web/dist/config.json
          else
            pnpm --filter @bar/infra exec tsx scripts/ci-outputs.ts outputs.json
          fi
      - name: Preview URL
        run: |
          if [ -n "$DOMAIN" ]; then
            echo "PREVIEW_URL=https://pr-$PR.preview.$DOMAIN" >> "$GITHUB_ENV"
          else
            echo "PREVIEW_URL=$BAR_SITE_URL" >> "$GITHUB_ENV"
          fi
      - name: Upload to the shared preview site
        if: env.DOMAIN != ''
        env:
          PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
          PREVIEW_DISTRIBUTION_ID: ${{ vars.PREVIEW_DISTRIBUTION_ID }}
        run: |
          aws s3 sync apps/web/dist "s3://$PREVIEW_BUCKET/pr-$PR/" --delete
          aws cloudfront create-invalidation --distribution-id "$PREVIEW_DISTRIBUTION_ID" --paths '/*'
      - name: Seed the backend with fixtures
        run: pnpm exec tsx apps/web/integration/seed.ts
      - name: Playwright against the preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PREVIEW_URL }}
        run: |
          pnpm --filter @bar/web exec playwright install --with-deps chromium
          pnpm --filter @bar/web run test:e2e
      - name: Integration tests (real DynamoDB and AppSync)
        run: pnpm --filter @bar/web run test:integration
      - name: Lighthouse (warn only)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            ${{ env.PREVIEW_URL }}/
            ${{ env.PREVIEW_URL }}/workshop
            ${{ env.PREVIEW_URL }}/liner-notes
          configPath: apps/web/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Comment the preview URL
        if: always() && env.PREVIEW_URL != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- bar-preview -->';
            const body = `${marker}\n🎶 Preview: ${process.env.PREVIEW_URL}\n\nBackend stacks: \`pr-${process.env.PR}-*\` (torn down when this PR closes).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # Agents' PRs (claude/*) fix their own failures; at most three attempts per
  # PR, shared with review fixes (.github/actions/agent-fix).
  fix:
    needs: [checks, pr-title, workflow-lint, generators, preview]
    if: >-
      failure()
      && github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'claude/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-fix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      # The fix action itself comes from the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: ./.github/actions/agent-fix
        with:
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          run-id: ${{ github.run_id }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          task: |
            The "Pull request" workflow failed on this PR (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            The failed jobs' logs are in `.agent/logs/`. Find the cause and fix it.
            If the failure is unrelated to this PR (an outage, a flaky external service), do not change code:
            say so in a PR comment and stop.
