name: Agent

# implement: an issue labelled `agent` (only people with write access can
#   label) is implemented end to end: branch claude/issue-<n>-…, verified,
#   PR opened with auto-merge. Review, fixes and merging follow from the PR
#   pipeline (agent-review.yml, agent-fix.yml, owner-gate.yml).
# respond: `@claude` in an issue or PR comment or review, from someone with
#   write access, gets an answer or a change on that PR's branch.
# Only label issues whose text you have read: it becomes the agent's prompt.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  implement:
    if: github.event_name == 'issues' && github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: agent-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @bar/web exec playwright install --with-deps chromium
      - name: Implement
        id: claude
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Implement this issue end to end, following CLAUDE.md and docs/agents.md.
            Read it with `gh issue view ${{ github.event.issue.number }} --comments`.

            1. Read what CLAUDE.md says to read for the areas involved. If the issue needs a decision
               that is Open, Parked or not covered in docs/decisions.md, or a design-vision call,
               do not start: comment the question on the issue (options and trade-offs) and finish
               with outcome `needs_owner`.
            2. Create the branch `claude/issue-${{ github.event.issue.number }}-<short-slug>` from main.
            3. Implement with the generators and docs/how-to/. Keep the change to what the issue asks.
            4. Verify: `pnpm typecheck && pnpm lint && pnpm test`, and `pnpm test:e2e` for anything visible.
               Fix what fails; do not weaken tests or checks.
            5. Commit with Conventional Commit messages and push: `git push -u origin HEAD`.
            6. Open the PR with a Conventional Commit title (it becomes the squash commit):
               write the body from .github/pull_request_template.md, starting with "Closes #${{ github.event.issue.number }}",
               to a file, then `gh pr create --base main --title "<title>" --body-file <file>`.
               Enable auto-merge: `gh pr merge --auto --squash`.
            Finish with the structured output.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 250
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pnpm:*),Bash(node:*),Bash(tools/generators/smoke.sh:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git switch:*),Bash(git checkout -b:*),Bash(git push -u origin HEAD:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr merge --auto:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["outcome","summary"],"properties":{"outcome":{"enum":["pr_opened","needs_owner","blocked"]},"pr_number":{"type":"integer"},"summary":{"type":"string"}}}'
      - name: Hand over when the agent could not finish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          outcome=$(jq -r '.outcome // "blocked"' <<<"${RESULT:-{\}}")
          if [ "$outcome" = pr_opened ]; then exit 0; fi
          gh api "repos/$REPO/issues/$ISSUE/labels" -f "labels[]=needs-owner" >/dev/null
          if [ "$outcome" != needs_owner ]; then
            summary=$(jq -r '.summary // "The agent stopped without a result."' <<<"${RESULT:-{\}}")
            gh api "repos/$REPO/issues/$ISSUE/comments" \
              -f body="The agent could not finish this issue: $summary ([run]($RUN_URL))" >/dev/null
          fi

  respond:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pnpm:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh run view:*)"
