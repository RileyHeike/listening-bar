name: Setup
description: Node and pnpm from mise.toml, dependencies installed from the lockfile.
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        echo "node=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(sed -n 's/^pnpm = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.versions.outputs.pnpm }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.node }}
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
